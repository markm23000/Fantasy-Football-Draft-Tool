<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 330px; margin: 0; padding: 14px; font-family: Arial, sans-serif; color: #111827; }
  h2 { margin: 0 0 10px; font-size: 20px; }
  .box { background:#f3f4f6; border-radius:10px; padding:10px 12px; margin-bottom:10px; line-height:1.45; }
  button { width:100%; border:0; border-radius:8px; padding:11px; font-weight:700; font-size:14px; margin:5px 0; cursor:pointer; background:#1d4ed8; color:#fff; }
  button.secondary { background:#374151; }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; }
  .row label { flex:1; font-size:13px; }
  input { width:64px; padding:7px; border:1px solid #d1d5db; border-radius:6px; }
  .small { font-size:12px; color:#6b7280; margin-top:8px; }
  .ok { color:#047857; font-weight:700; }
  .bad { color:#b91c1c; font-weight:700; }
  .warn { color:#b45309; font-weight:700; }
  .readyBig { color:#047857; font-weight:800; font-size:18px; margin-bottom:4px; }
</style>
</head>
<body>
  <h2>ESPN → Excel v2.4 FIXED</h2>
  <div class="box" id="status">Checking bridge + Excel…</div>
  <div class="small"><b>Draft-night rule:</b> wait for the green READY FOR DRAFT message before pick #1.</div>
  <div class="row">
    <label for="leagueSize"><b>League size</b><br><span class="small">Used to convert R#, P# to overall pick.</span></label>
    <input id="leagueSize" type="number" min="4" max="20" step="1" value="10">
  </div>
  <button id="save">Save Size + Reconcile Ticker</button>
  <button id="check" class="secondary">Check Connection</button>
  <div class="small">Reads <b>only the Picks sidebar</b>. Pick # is the key. Hidden/transition cards are recoverable, pending picks are sorted, and Excel row = pick + 1.</div>
<script src="popup.js"></script>
</body>
</html>
